name: Dev Builds
on:
  push:
    branches:
      - develop
      - 'feature/**'
  workflow_dispatch:

jobs:
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Release Kotlin
        run: ./gradlew :app:compileReleaseKotlin -PapplyFirebasePlugins=false --stacktrace

  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_google_services: ${{ steps.check.outputs.has_google_services }}
    steps:
      - id: check
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_JSON" ]; then
            echo "has_google_services=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_google_services=false" >> "$GITHUB_OUTPUT"
          fi

  android-foss:
    needs: [ android-compile ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE_64 }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            echo "$ENCODED_STRING" | base64 -d > pipixiv.jks
          else
            keytool -genkeypair -v -keystore pipixiv.jks -alias pipixiv \
              -keyalg RSA -keysize 2048 -validity 1 -storepass android \
              -keypass android -dname "CN=CI Debug, OU=CI, O=CI, L=NA, S=NA, C=US"
          fi

      - name: Build Foss Release apk
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'android' }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS || 'pipixiv' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          sed -i -e '/firebase/d' -e '/google.services/d' {.,app}/build.gradle.kts
          sed -i '/foojay/d' settings.gradle.kts
          ./gradlew assembleRelease -PapplyFirebasePlugins=false -Pdebug=false --stacktrace

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-foss-apk
          path: |
            app/release/foss/*.apk

  android-default:
    needs: [ android-compile, check-secrets ]
    if: needs.check-secrets.outputs.has_google_services == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE_64 }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            echo "$ENCODED_STRING" | base64 -d > pipixiv.jks
          else
            keytool -genkeypair -v -keystore pipixiv.jks -alias pipixiv \
              -keyalg RSA -keysize 2048 -validity 1 -storepass android \
              -keypass android -dname "CN=CI Debug, OU=CI, O=CI, L=NA, S=NA, C=US"
          fi

      - name: Add Google Services
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICE_JSON" > app/google-services.json

      - name: Build Default Release apk
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'android' }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS || 'pipixiv' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew assembleRelease -PapplyFirebasePlugins=true -Pdebug=false --stacktrace

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-default-apk
          path: |
            app/release/default/*.apk
